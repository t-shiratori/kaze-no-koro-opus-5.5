<text x='235.0' y='290.0' font-size='12' fill='#333' text-anchor='middle' font-weight='normal'>LUT の縦座標 v → 仰角</text>
<text x='70.0' y='20.0' font-size='12' fill='#333' text-anchor='start' font-weight='normal'>仰角</text>
<text x='440.0' y='50.0' font-size='14' fill='#2f6db5' text-anchor='start' font-weight='bold'>v = 0.5 + 0.5·sign(el)·√(|el| / 90°)</text>
<text x='440.0' y='90.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>・地平線付近（傾きがゆるい所）に</text>
<text x='440.0' y='112.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>  テクセルが集中する</text>
<text x='440.0' y='134.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>・空の色が最も激しく変わるのは</text>
<text x='440.0' y='156.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>  地平線のすぐ上なので、</text>
<text x='440.0' y='178.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>  256×128 の小さな LUT でも</text>
<text x='440.0' y='200.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>  夕焼けの帯がなめらかに出る</text>
<text x='440.0' y='222.0' font-size='13' fill='#333' text-anchor='start' font-weight='normal'>・横軸 u は方位角 (atan2(z, x))</text>
