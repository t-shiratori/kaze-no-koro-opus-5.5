<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0952a"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0f2"/><stop offset="1" stop-color="#f4f1e8"/>
    </linearGradient>
    <radialGradient id="cl" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ebf1"/>
    </radialGradient>
  </defs>
  <rect width="900" height="520" rx="12" fill="url(#sky)"/>
  <!-- sea -->
  <rect x="0" y="440" width="900" height="80" fill="#3d6c95"/>
  <text x="20" y="470" font-size="12" fill="#e9f1f8">海面 y = 0</text>

  <!-- cloud layer slab -->
  <rect x="0" y="60" width="900" height="250" fill="#ffffff" opacity="0.25"/>
  <line x1="0" y1="310" x2="900" y2="310" stroke="#7a9cc0" stroke-dasharray="6 4"/>
  <line x1="0" y1="60" x2="900" y2="60" stroke="#7a9cc0" stroke-dasharray="6 4"/>
  <text x="890" y="304" font-size="12" fill="#4a6f96" text-anchor="end">CLOUD_BOTTOM 560 m</text>
  <text x="890" y="76" font-size="12" fill="#4a6f96" text-anchor="end">CLOUD_TOP 4600 m</text>

  <!-- hazy air region -->
  <rect x="0" y="310" width="900" height="130" fill="#f6e6c4" opacity="0.35"/>
  <text x="20" y="430" font-size="12" fill="#8a6a2a">① 雲の下のかすみ層：光芒（雲の影マップを参照）と雨のカーテン（44 ステップ）</text>

  <!-- clouds -->
  <path d="M420,260 C410,220 440,190 470,200 C480,160 540,150 560,185 C590,170 630,190 625,225 C650,235 650,270 620,275 L430,278 C405,278 400,265 420,260 Z" fill="url(#cl)" stroke="#9fb3c9"/>
  <path d="M660,250 C655,225 680,215 700,222 C712,200 750,200 760,222 C785,220 795,245 780,258 L670,262 C655,262 652,254 660,250 Z" fill="url(#cl)" stroke="#9fb3c9"/>
  <!-- rain under the second cloud -->
  <g stroke="#8d9aa8" stroke-width="1.2" opacity="0.7">
    <line x1="680" y1="268" x2="675" y2="430"/><line x1="700" y1="268" x2="695" y2="430"/>
    <line x1="720" y1="268" x2="715" y2="430"/><line x1="740" y1="268" x2="735" y2="430"/>
    <line x1="760" y1="268" x2="755" y2="430"/>
  </g>
  <text x="700" y="360" font-size="11" fill="#5d6874">雨</text>

  <!-- sun -->
  <circle cx="830" cy="28" r="16" fill="#f6c453"/>
  <text x="808" y="32" font-size="12" fill="#8a6a2a" text-anchor="end">太陽 L</text>

  <!-- camera -->
  <path d="M80,395 l22,-8 l0,16 z" fill="#24303c"/>
  <text x="58" y="420" font-size="12" fill="#24303c">カメラ</text>

  <!-- view ray -->
  <line x1="102" y1="395" x2="880" y2="110" stroke="#2f6db5" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="320" font-size="12" fill="#2f6db5" transform="rotate(-20 250 320)">視線レイ rd</text>

  <!-- steps along the ray inside the slab: growing step -->
  <g fill="#2f6db5">
    <circle cx="350" cy="304" r="3"/>
    <circle cx="378" cy="294" r="3"/>
    <circle cx="410" cy="282" r="3"/>
    <circle cx="447" cy="269" r="4"/>
    <circle cx="490" cy="253" r="4"/>
    <circle cx="540" cy="235" r="4"/>
    <circle cx="598" cy="214" r="4"/>
    <circle cx="665" cy="189" r="3"/>
    <circle cx="742" cy="161" r="3"/>
  </g>
  <text x="300" y="250" font-size="12" fill="#24303c">② 雲の層（スラブ）だけを最大 110 ステップ</text>
  <text x="300" y="266" font-size="11.5" fill="#55606b">歩幅 = clamp(t·0.009, 10 m, 420 m)：遠いほど粗く</text>

  <!-- light march from one sample -->
  <g stroke="#e0952a" stroke-width="1.8" fill="none">
    <line x1="490" y1="253" x2="502" y2="245" marker-end="url(#o)"/>
    <line x1="505" y1="243" x2="527" y2="228" marker-end="url(#o)"/>
    <line x1="530" y1="226" x2="567" y2="201" marker-end="url(#o)"/>
    <line x1="570" y1="199" x2="632" y2="157" marker-end="url(#o)"/>
    <line x1="636" y1="155" x2="740" y2="85" marker-end="url(#o)"/>
  </g>
  <text x="590" y="122" font-size="12" fill="#b0701a">ライトマーチ 6 回</text>
  <text x="590" y="138" font-size="11.5" fill="#b0701a">55 m から 1.7 倍ずつ伸ばす</text>

  <!-- side notes -->
  <rect x="24" y="96" width="248" height="128" rx="8" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="36" y="118" font-size="13" font-weight="bold" fill="#24303c">各サンプルで</text>
  <text x="36" y="138" font-size="11.5" fill="#55606b">1. 天気マップで被覆を引く</text>
  <text x="36" y="155" font-size="11.5" fill="#55606b">2. 粗い形 → 0 なら 1.6 倍で飛ばす</text>
  <text x="36" y="172" font-size="11.5" fill="#55606b">3. 3D ノイズで浸食した密度</text>
  <text x="36" y="189" font-size="11.5" fill="#55606b">4. 太陽へのライトマーチ → Beer 則</text>
  <text x="36" y="206" font-size="11.5" fill="#55606b">5. 透過率 T &lt; 0.012 で打ち切り</text>

  <text x="24" y="505" font-size="12" fill="#e9f1f8">シーンの深度より奥は数えない（島や機体の手前の雲だけを足す）。開始位置はピクセル毎・フレーム毎にずらし、時間方向の蓄積でノイズを消す。</text>
</svg>
